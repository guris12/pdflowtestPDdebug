# Smoke test for vlsi.ondevtra.com/dashboard/debug
# Richer dummy ORFS tree: logs/sky130hd/gcd/base/{1..6}_*.log + STA timing report.

name: PD debug smoke (dummy flow outputs)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dummy-flow-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate richer dummy ORFS outputs
        run: |
          set -euo pipefail
          PDK=sky130hd
          SLUG=gcd
          LOG_BASE="logs/${PDK}/${SLUG}/base"
          RPT_BASE="reports/${PDK}/${SLUG}/base"
          RES_BASE="results/${PDK}/${SLUG}/base"
          mkdir -p "$LOG_BASE" "$RPT_BASE" "$RES_BASE"

          for n in 1 2 3 4 5; do
            echo "[INFO] stage ${n} completed OK" > "${LOG_BASE}/${n}_stage.log"
            touch "${RES_BASE}/${n}_stage.odb"
          done
          echo "[INFO] yosys mapped 211 cells" > "${LOG_BASE}/1_synth.log"
          touch "${RES_BASE}/1_synth.odb"

          cat > "${LOG_BASE}/6_sta.log" <<'EOF'
          [INFO] OpenSTA finished
          [INFO] Setup WNS -0.12 ns TNS -1.40 ns
          [INFO] Hold WNS 0.05 ns
          EOF

          cat > "${RPT_BASE}/6_sta.rpt" <<'EOF'
          Design: gcd
          Corner: default
          Setup WNS: -0.12 ns
          Setup TNS: -1.40 ns
          Hold WNS: 0.05 ns
          Violated paths (setup): 3
            path1: slack -0.12 ns  (reg_a -> reg_b)
            path2: slack -0.08 ns
            path3: slack -0.05 ns
          EOF

          touch "${RES_BASE}/6_sta.odb"

          echo "Tree:"
          find logs reports results -type f | sort

      - name: Upload flow artifact for dashboard debugger
        uses: actions/upload-artifact@v4
        with:
          name: orfs-flow-outputs
          path: |
            logs
            reports
            results
          retention-days: 7

      - name: Summary
        run: |
          echo "Artifact: orfs-flow-outputs"
          echo "Dashboard: https://vlsi.ondevtra.com/dashboard/debug"
          echo "Connect: guris12/pdflowtestPDdebug"
