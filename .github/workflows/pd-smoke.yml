          [INFO DPL-0001] Detailed placement starting.
          [INFO DPL-0020] Placed 179 instances, 0 with displacement.
          [INFO DPL-0032] Detailed placement complete. HPWL improved 2.1%.
          LOGEOF

          cat > logs/4_1_cts.log <<'LOGEOF'
          [INFO CTS-0003] Number of sinks: 32
          [INFO CTS-0004] Clock net: clk
          [INFO CTS-0007] Number of CTS buffers: 8
          [INFO CTS-0008] CTS buffer types: sky130_fd_sc_hd__clkbuf_4
          [INFO CTS-0010] Clock tree depth: 3

          [INFO CTS-0016] Pre-CTS timing:
            WNS: -0.42 ns  TNS: -2.14 ns
          [INFO CTS-0017] Post-CTS timing:
            WNS: -0.31 ns  TNS: -1.58 ns
          [WARNING CTS-0099] Skew target 0.1ns not met. Actual skew: 0.18ns
          [INFO CTS-0098] Clock tree insertion delay: 0.62 ns
          LOGEOF

          cat > logs/5_1_route.log <<'LOGEOF'
          [INFO GRT-0001] Running global routing.
          [INFO GRT-0017] Design has 236 nets.
          [INFO GRT-0020] Running routing with 5 layers: li1 met1 met2 met3 met4

          [INFO GRT-0101] Running congestion iterations:
            Iteration 1: 12 overflow, 2.1% congested
            Iteration 2:  4 overflow, 0.8% congested
            Iteration 3:  0 overflow, 0.0% congested
          [INFO GRT-0018] Global routing complete. No overflow.

          [INFO DRT-0001] Running detailed routing.
          [INFO DRT-0002] Detailed routing uses 5 metal layers.
          [INFO DRT-0267] cpu time = 00:00:12, elapsed time = 00:00:04, peak mem = 312 MB

          [INFO DRT-0199] Number of DRC violations:
            met1 Short:     0
            met1 Spacing:   2
            met2 Spacing:   1
            via1 Enclosure: 0
            Total:          3
          [WARNING] 3 DRC violations remain after detailed routing.
          LOGEOF

          # ── reports/ ───────────────────────────────────────────────────────
          cat > reports/synth_stat.rpt <<'RPTEOF'
          === gcd ===

             Number of wires:                308
             Number of wire bits:            832
             Number of cells:                211

             Chip area for module '\gcd': 4201.632000

             Cell type distribution:
               sky130_fd_sc_hd__dfxtp_1       32 (15.2%)
               sky130_fd_sc_hd__mux2_1        30 (14.2%)
               sky130_fd_sc_hd__nand2_1       28 (13.3%)
               sky130_fd_sc_hd__inv_1         22 (10.4%)
               sky130_fd_sc_hd__nor2_1        19 (9.0%)
               sky130_fd_sc_hd__and2_1        18 (8.5%)
               sky130_fd_sc_hd__o21ai_1       16 (7.6%)
               sky130_fd_sc_hd__buf_1         14 (6.6%)
               sky130_fd_sc_hd__a21oi_1       12 (5.7%)
               sky130_fd_sc_hd__xnor2_1       10 (4.7%)
               sky130_fd_sc_hd__xor2_1        10 (4.7%)
          RPTEOF

          cat > reports/final_timing.rpt <<'RPTEOF'
          =========================================================================
           report_checks -path_delay max (Setup)
          -------------------------------------------------------------------------
          Startpoint: req_val (input port clocked by clk)
          Endpoint: _456_ (rising edge-triggered flip-flop clocked by clk)
          Path Group: clk
          Path Type: max

            Delay    Time   Description
