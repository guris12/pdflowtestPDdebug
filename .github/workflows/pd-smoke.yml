# Smoke test for vlsi.ondevtra.com/dashboard/debug
# Creates realistic ORFS-shaped logs/reports/results matching a gcd/sky130hd flow run.

name: PD debug smoke (realistic ORFS outputs)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  flow-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate realistic ORFS flow outputs
        run: |
          set -euo pipefail
          mkdir -p logs reports results designs/sky130hd/gcd

          # ── logs/ ──────────────────────────────────────────────────────────
          cat > logs/1_1_yosys.log <<'LOGEOF'
          1. Executing Verilog-2005 frontend: designs/sky130hd/gcd/gcd.v
          Parsing Verilog input from `designs/sky130hd/gcd/gcd.v' to AST representation.
          Generating RTLIL representation for module `\gcd'.
          Successfully finished Verilog frontend.

          2. Executing SYNTH pass.
          2.1. Executing HIERARCHY pass (managing design hierarchy).
          2.2. Executing PROC pass (convert processes to netlists).
          2.3. Executing OPT_EXPR pass (perform const folding).
          2.4. Executing TECHMAP pass (map to technology library).

          3. Printing statistics.
             Number of wires:                308
             Number of wire bits:            832
             Number of public wires:          41
             Number of public wire bits:     301
             Number of memories:               0
             Number of memory bits:            0
             Number of processes:              0
             Number of cells:                211
               sky130_fd_sc_hd__a21oi_1       12
               sky130_fd_sc_hd__and2_1        18
               sky130_fd_sc_hd__buf_1         14
               sky130_fd_sc_hd__dfxtp_1       32
               sky130_fd_sc_hd__inv_1         22
               sky130_fd_sc_hd__mux2_1        30
               sky130_fd_sc_hd__nand2_1       28
               sky130_fd_sc_hd__nor2_1        19
               sky130_fd_sc_hd__o21ai_1       16
               sky130_fd_sc_hd__xnor2_1       10
               sky130_fd_sc_hd__xor2_1        10

          [INFO] Synthesis complete for design gcd
          [INFO] Total cell area: 4201.632 um^2
          [INFO] Design utilization target: 50%
          LOGEOF

          cat > logs/2_1_floorplan.log <<'LOGEOF'
          [INFO ODB-0127] Reading DEF file: results/2_floorplan.def
          [INFO IFP-0001] Added 40 rows of height 2.72 microns.
          [INFO IFP-0002] Core area: (5.52 5.44) (95.68 114.24)
          [INFO IFP-0003] Die area:  (0.0  0.0)  (100.0 120.0)

          [INFO PDN-0001] Generating PDN for design gcd
          [INFO PDN-0016] Power grid: VDD
          [INFO PDN-0017] Power grid: VSS
          [INFO PDN-0016] Generating stripes for layer met4:
            Width 1.6 pitch 27.14 offset 13.57
          [INFO PDN-0016] Generating stripes for layer met5:
            Width 1.6 pitch 27.14 offset 13.57
          [INFO PDN-0036] Inserting standard cell filler cells.
          [INFO PDN-0037] Added 180 filler cells.
          LOGEOF

          cat > logs/3_1_place_gp.log <<'LOGEOF'
          [INFO GPL-0002] DBU: 1000
          [INFO GPL-0003] SiteSize: (0.46 2.72)
          [INFO GPL-0004] CoreAreaLxLy: (5520 5440)
          [INFO GPL-0005] CoreAreaUxUy: (95680 114240)
          [INFO GPL-0006] NumInstances: 211
          [INFO GPL-0007] NumPlaceInstances: 179
          [INFO GPL-0008] NumFixedInstances: 32
          [INFO GPL-0009] NumDummyInstances: 0
          [INFO GPL-0010] NumNets: 236
          [INFO GPL-0011] NumPins: 632

          [NesterovSolve] Iter: 1    overflow: 0.92  HPWL: 123405
          [NesterovSolve] Iter: 50   overflow: 0.41  HPWL: 98712
          [NesterovSolve] Iter: 100  overflow: 0.18  HPWL: 87234
          [NesterovSolve] Iter: 150  overflow: 0.07  HPWL: 84102
