             0.098   0.494 ^ _220_/Y (sky130_fd_sc_hd__a21oi_1)
             0.146   0.640 v _231_/Y (sky130_fd_sc_hd__mux2_1)
             0.123   0.763 ^ _242_/Y (sky130_fd_sc_hd__xor2_1)
             0.189   0.952 v _253_/Y (sky130_fd_sc_hd__o21ai_1)
             0.115   1.067 ^ _264_/Y (sky130_fd_sc_hd__nand2_1)
             0.087   1.154 v _275_/Y (sky130_fd_sc_hd__inv_1)
             0.094   1.248 ^ _286_/Y (sky130_fd_sc_hd__nor2_1)
             0.000   1.248 ^ _456_/D (sky130_fd_sc_hd__dfxtp_1)
                     1.248   data arrival time

             2.000   2.000   clock clk (rise edge)
             0.000   2.000   clock network delay (ideal)
            -0.100   1.900   clock uncertainty
             0.000   1.900   clock reconvergence pessimism
            -0.050   1.850   library setup time
                     1.850   data required time
          ---------------------------------------------------------
                     1.850   data required time
                    -1.248   data arrival time
          ---------------------------------------------------------
                     0.602   slack (MET)

          =========================================================================
           report_checks -path_delay max (Setup) — WORST PATH
          -------------------------------------------------------------------------
          Startpoint: _123_ (rising edge-triggered flip-flop clocked by clk)
          Endpoint: _389_ (rising edge-triggered flip-flop clocked by clk)
          Path Group: clk
          Path Type: max

            Delay    Time   Description
          ---------------------------------------------------------
             0.000   0.000   clock clk (rise edge)
             0.620   0.620   clock network delay (propagated)
             0.000   0.620 ^ _123_/CLK (sky130_fd_sc_hd__dfxtp_1)
             0.312   0.932 ^ _123_/Q (sky130_fd_sc_hd__dfxtp_1)
             0.156   1.088 v _134_/Y (sky130_fd_sc_hd__nand2_1)
             0.142   1.230 ^ _145_/Y (sky130_fd_sc_hd__a21oi_1)
             0.198   1.428 v _156_/Y (sky130_fd_sc_hd__mux2_1)
             0.167   1.595 ^ _167_/Y (sky130_fd_sc_hd__xnor2_1)
             0.213   1.808 v _178_/Y (sky130_fd_sc_hd__o21ai_1)
             0.145   1.953 ^ _189_/Y (sky130_fd_sc_hd__nand2_1)
             0.098   2.051 v _200_/Y (sky130_fd_sc_hd__inv_1)
             0.112   2.163 ^ _389_/D (sky130_fd_sc_hd__dfxtp_1)
                     2.163   data arrival time

             2.000   2.000   clock clk (rise edge)
             0.620   2.620   clock network delay (propagated)
            -0.100   2.520   clock uncertainty
             0.000   2.520   clock reconvergence pessimism
            -0.050   2.470   library setup time
                     2.470   data required time
          ---------------------------------------------------------
                     2.470   data required time
                    -2.163   data arrival time
          ---------------------------------------------------------
                     0.307   slack (MET)

          =========================================================================
          WNS (worst negative slack): 0.000 ns  (all paths met)
          TNS (total negative slack):  0.000 ns
          Number of violating paths: 0
          RPTEOF

          cat > reports/final_drc.rpt <<'RPTEOF'
          =========================================================================
           DRC Report for design gcd (sky130hd)
           Generated by OpenROAD detailed_route
          =========================================================================

          Violation 1:
            Type: Metal1 Minimum Spacing
            Layer: met1
            Srcs: net:_net_42 net:_net_87
            BBox: (23.460 45.120) (23.690 45.350)
            Required: 0.140 um  Actual: 0.112 um

          Violation 2:
            Type: Metal1 Minimum Spacing
            Layer: met1
            Srcs: net:clk net:_net_12
            BBox: (67.230 78.880) (67.460 79.110)
            Required: 0.140 um  Actual: 0.098 um

          Violation 3:
            Type: Metal2 Minimum Spacing
            Layer: met2
            Srcs: net:_net_103 net:_net_156
            BBox: (41.920 22.440) (42.150 22.670)
            Required: 0.140 um  Actual: 0.121 um

          =========================================================================
          Total DRC violations: 3
            met1 spacing: 2
            met2 spacing: 1
          =========================================================================
          RPTEOF

          cat > reports/power.rpt <<'RPTEOF'
          =========================================================================
           Power Report for design gcd
          =========================================================================
          Group             Internal   Switching    Leakage      Total
                              Power      Power      Power       Power    (%)
          ----------------------------------------------------------------
          Sequential         0.0824     0.0142     0.00032     0.0969   (42.1%)
          Combinational      0.0712     0.0398     0.00089     0.1119   (48.6%)
          Macro              0.0000     0.0000     0.00000     0.0000   (0.0%)
          Pad                0.0000     0.0000     0.00000     0.0000   (0.0%)
          ----------------------------------------------------------------
          Total              0.1536     0.0540     0.00121     0.2088   (mW)
          ================================================================
          RPTEOF

          # ── results/ ───────────────────────────────────────────────────────
          cat > results/metrics.json <<'REOF'
          {
            "design": "gcd",
            "platform": "sky130hd",
            "stages": {
              "synth": {"status": "done", "cells": 211, "area_um2": 4201.632},
              "floorplan": {"status": "done", "die_area_um2": 12000.0, "utilization": 0.35},
              "place": {"status": "done", "hpwl": 83210, "overflow": 0.03},
              "cts": {"status": "done", "buffers": 8, "depth": 3, "skew_ns": 0.18},
              "route": {"status": "done", "drc_count": 3, "overflow": 0}
            },
            "timing": {
              "wns_ns": 0.307,
              "tns_ns": 0.0,
              "violating_paths": 0
            },
            "power_mw": 0.2088
          }
          REOF

          # ── designs/ (config) ──────────────────────────────────────────────
          cat > designs/sky130hd/gcd/config.mk <<'CFGEOF'
          export DESIGN_NAME = gcd
          export PLATFORM    = sky130hd
          export VERILOG_FILES = ./designs/src/gcd/gcd.v
          export SDC_FILE     = ./designs/sky130hd/gcd/constraint.sdc
          export CORE_UTILIZATION = 50
          export CORE_ASPECT_RATIO = 1
          export CORE_MARGIN = 2
          export PLACE_DENSITY = 0.65
          CFGEOF

          cat > designs/sky130hd/gcd/constraint.sdc <<'SDCEOF'
          create_clock [get_ports clk] -name clk -period 2.0
          set_input_delay  0.2 -clock clk [all_inputs]
          set_output_delay 0.2 -clock clk [all_outputs]
          set_load 0.01 [all_outputs]
          set_driving_cell -lib_cell sky130_fd_sc_hd__buf_1 [all_inputs]
          SDCEOF

          echo "Generated realistic ORFS flow tree:"
          find logs reports results designs -type f | sort

      - name: Upload flow artifact for dashboard debugger
        uses: actions/upload-artifact@v4
        with:
          name: orfs-flow-outputs
          path: |
            logs
            reports
            results
            designs
          retention-days: 7

      - name: Summary
        run: |
          echo "### Flow artifact uploaded" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Design | gcd |" >> $GITHUB_STEP_SUMMARY
          echo "| PDK | sky130hd |" >> $GITHUB_STEP_SUMMARY
          echo "| Cells | 211 |" >> $GITHUB_STEP_SUMMARY
          echo "| WNS | 0.307 ns (MET) |" >> $GITHUB_STEP_SUMMARY
          echo "| DRC | 3 violations |" >> $GITHUB_STEP_SUMMARY
          echo "| Power | 0.2088 mW |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Test at: https://vlsi.ondevtra.com/dashboard/debug" >> $GITHUB_STEP_SUMMARY
